name: Temporary print check
on:
  pull_request:
    paths: ['windows/shipping/**', 'tmp-printcheck/**', '.github/workflows/tmp-printcheck.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: Add file-backed test printer
        run: |
          New-Item -ItemType Directory C:\printcheck | Out-Null
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Output "resolution: $_" }
          Add-PrinterPort -Name 'C:\printcheck\zebra.pdf'
          Add-Printer -Name 'ZDesigner Test' -DriverName 'Microsoft Print To PDF' -PortName 'C:\printcheck\zebra.pdf'
      - name: Build
        working-directory: windows
        run: ../tools/windows/build.ps1 -App shipping-windows -Architecture x64
      - name: Drive the connected UI against canned responses
        run: |
          $env:REAI_TMP_FAKE = '1'
          $app = Start-Process "dist/shipping-windows/win-x64/ReAI.Shipping.exe" -PassThru
          $desktopRuntime = Get-ChildItem "$env:DOTNET_ROOT/shared/Microsoft.WindowsDesktop.App" -Directory | Where-Object { ([System.Management.Automation.SemanticVersion]$_.Name).Major -eq [Environment]::Version.Major } | Sort-Object { [System.Management.Automation.SemanticVersion]$_.Name } -Descending | Select-Object -First 1
          Add-Type -Path "$($desktopRuntime.FullName)/UIAutomationTypes.dll"
          Add-Type -Path "$($desktopRuntime.FullName)/UIAutomationClient.dll"
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Mouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            public static void Click(int x, int y) { SetCursorPos(x, y); System.Threading.Thread.Sleep(200); mouse_event(2, 0, 0, 0, UIntPtr.Zero); mouse_event(4, 0, 0, 0, UIntPtr.Zero); }
          }
          "@
          $deadline = [DateTime]::UtcNow.AddSeconds(40)
          do { Start-Sleep -Milliseconds 500; $app.Refresh(); if ($app.HasExited) { throw "App exited: $($app.ExitCode)" } } while ($app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
          $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
          function Find($like) {
            $all = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($element in $all) { if ($element.Current.Name -like $like) { return $element } }
            return $null
          }
          function Shot($name) {
            $app.Refresh(); if ($app.HasExited) { throw "App exited before $name`: $($app.ExitCode)" }
            $bounds = $window.Current.BoundingRectangle
            $bitmap = New-Object System.Drawing.Bitmap ([int]$bounds.Width), ([int]$bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen([System.Drawing.Point]::new([int]$bounds.X, [int]$bounds.Y), [System.Drawing.Point]::Empty, $bitmap.Size)
            $bitmap.Save("C:\printcheck\$name.png"); $graphics.Dispose(); $bitmap.Dispose()
            Write-Output "shot $name"
          }
          function Press($like, $wait = 4) {
            $element = $null; $until = [DateTime]::UtcNow.AddSeconds(20)
            while (-not $element -and [DateTime]::UtcNow -lt $until) { $element = Find $like; if (-not $element) { Start-Sleep -Milliseconds 500 } }
            if (-not $element) { Shot "missing"; throw "Not found: $like" }
            $pattern = $null
            if ($element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pattern)) { $pattern.Invoke(); Write-Output "invoke $like" }
            else { $r = $element.Current.BoundingRectangle; [Mouse]::Click([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)); Write-Output "click $like at $($r.X),$($r.Y)" }
            Start-Sleep -Seconds $wait
          }
          try {
            if (-not (Find 'SO-5*')) { Start-Sleep -Seconds 5 }
            Shot '1-connected'
            Press 'SO-5*'; Shot '2-order'
            Press 'Recipient' 2; Shot '3-recipient'
            Press 'Ship & print*' 14; Shot '4-shipped'
            Press 'History'; Shot '5-history'
            Press 'Locations'; Shot '6-locations'
            Press 'A-01-02' 2; Shot '7-preview'
            Press 'Print label' 8; Shot '8-location-printed'
            Press 'Shipping'; Shot '9-back'
          } finally {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -like '*ReAI.Shipping*' } | Select-Object -First 3 -ExpandProperty Message
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
            Get-Content "$env:LOCALAPPDATA\ReAI\Shipping\shipping.json" -ErrorAction SilentlyContinue
            Get-ChildItem C:\printcheck | Format-Table Name, Length
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: uicheck
          path: C:\printcheck
          retention-days: 3
