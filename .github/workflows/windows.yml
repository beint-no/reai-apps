name: Windows apps
on:
  pull_request:
    paths: ['windows/**', 'tools/windows/**', 'apps.json', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      app:
        description: Windows app to release (unsigned, no signing fee)
        required: true
        type: choice
        options: [import-windows, time-tracker-windows]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
      app: ${{ steps.apps.outputs.app }}
      version: ${{ steps.apps.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - id: apps
        run: python3 tools/windows/matrix.py
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: windows/global.json
      - name: Build self-contained Windows app
        run: ../tools/windows/build.ps1 -App '${{ matrix.app }}' -Architecture '${{ matrix.architecture }}' -Version '${{ matrix.version }}'
      - name: Verify native window opens
        if: matrix.architecture == 'x64'
        run: |
          $started = Get-Date
          $manifest = (Get-Content ../apps.json -Raw | ConvertFrom-Json).PSObject.Properties['${{ matrix.app }}'].Value
          $app = Start-Process "../dist/${{ matrix.app }}/win-x64/$($manifest.executable)" -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "App exited during startup: $($app.ExitCode)" }
            } while ($app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($app.MainWindowHandle -eq 0) { throw 'No native window appeared' }
            $desktopRuntime = Get-ChildItem "$env:DOTNET_ROOT/shared/Microsoft.WindowsDesktop.App" -Directory | Where-Object { ([System.Management.Automation.SemanticVersion]$_.Name).Major -eq [Environment]::Version.Major } | Sort-Object { [System.Management.Automation.SemanticVersion]$_.Name } -Descending | Select-Object -First 1
            Add-Type -Path "$($desktopRuntime.FullName)/UIAutomationTypes.dll"
            Add-Type -Path "$($desktopRuntime.FullName)/UIAutomationClient.dll"
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $condition = New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty), 'Connect to ReAI'
            do {
              $button = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
              if ($button) { break }
              Start-Sleep -Milliseconds 500
              $app.Refresh()
            } while (-not $app.HasExited -and [DateTime]::UtcNow -lt $deadline)
            if (-not $button) {
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started} -ErrorAction SilentlyContinue | Where-Object { $_.Message -like ('*' + $manifest.executable + '*') } | Select-Object -First 5 -ExpandProperty Message
              throw "The connection control did not render. Exited: $($app.HasExited), exit code: $($app.ExitCode)"
            }
            Write-Output "Native window and connection control rendered: $($app.MainWindowTitle)"
            Add-Type -AssemblyName System.Drawing
            $bounds = $window.Current.BoundingRectangle
            $size = [System.Drawing.Size]::new([int]$bounds.Width, [int]$bounds.Height)
            $location = [System.Drawing.Point]::new([int]$bounds.X, [int]$bounds.Y)
            $bitmap = New-Object System.Drawing.Bitmap $size.Width, $size.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($location, [System.Drawing.Point]::Empty, $size)
            $bitmap.Save("$env:GITHUB_WORKSPACE/dist/${{ matrix.app }}/startup.png")
            $graphics.Dispose()
            $bitmap.Dispose()
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id } }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.app }}-${{ matrix.architecture }}-unsigned
          path: dist/${{ matrix.app }}/*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.architecture == 'x64'
        with:
          name: ${{ matrix.app }}-startup
          path: dist/${{ matrix.app }}/startup.png
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ needs.prepare.outputs.app }}-*-unsigned
          merge-multiple: true
          path: dist/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Verify both archives and create release notes
        env:
          APP: ${{ needs.prepare.outputs.app }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 tools/windows/release.py "$APP" --version "$VERSION" --directory dist/release
      - name: Publish unsigned download
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ needs.prepare.outputs.app }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$APP/v$VERSION" dist/release/*.zip dist/release/SHA256SUMS --target "$GITHUB_SHA" --draft --latest=false --title "$APP $VERSION (unsigned)" --notes-file dist/release/release-notes.md
          gh release edit "$APP/v$VERSION" --draft=false --latest=false
          gh workflow run pages.yml --ref main
