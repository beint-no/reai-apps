name: Temporary update check
on:
  pull_request:
    paths: ['windows/shipping/**', '.github/workflows/tmp-updatecheck.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: Build three versions
        working-directory: windows
        run: |
          $staging = "$env:LOCALAPPDATA\ReAI\Shipping\update"
          New-Item -ItemType Directory C:\shots, $staging | Out-Null
          foreach ($build in @{ v = '0.1.1'; to = 'C:\app' }, @{ v = '0.1.2'; to = "$staging\0.1.2" }, @{ v = '0.1.3'; to = 'C:\later\0.1.3' }) {
            ../tools/windows/build.ps1 -App shipping-windows -Architecture x64 -Version $build.v
            Copy-Item ../dist/shipping-windows/win-x64 $build.to -Recurse
          }
          Set-Content C:\app\keep.txt 'not part of the app'
      - name: Update in place
        run: |
          $desktopRuntime = Get-ChildItem "$env:DOTNET_ROOT/shared/Microsoft.WindowsDesktop.App" -Directory | Where-Object { ([System.Management.Automation.SemanticVersion]$_.Name).Major -eq [Environment]::Version.Major } | Sort-Object { [System.Management.Automation.SemanticVersion]$_.Name } -Descending | Select-Object -First 1
          Add-Type -Path "$($desktopRuntime.FullName)/UIAutomationTypes.dll"
          Add-Type -Path "$($desktopRuntime.FullName)/UIAutomationClient.dll"
          Add-Type -AssemblyName System.Drawing
          $staging = "$env:LOCALAPPDATA\ReAI\Shipping\update"
          function Version { (Get-Item C:\app\ReAI.Shipping.exe).VersionInfo.FileVersion }
          function Running { Get-Process ReAI.Shipping -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq 'C:\app\ReAI.Shipping.exe' } }
          function Window($process) {
            $deadline = [DateTime]::UtcNow.AddSeconds(40)
            do { Start-Sleep -Milliseconds 500; $process.Refresh(); if ($process.HasExited) { throw "App exited: $($process.ExitCode)" } } while ($process.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
          }
          function Find($window, $name) {
            $condition = New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty), $name
            $until = [DateTime]::UtcNow.AddSeconds(20)
            do { $found = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition); if ($found) { return $found }; Start-Sleep -Milliseconds 500 } while ([DateTime]::UtcNow -lt $until)
            throw "Not found: $name"
          }
          function Shot($window, $name) {
            $bounds = $window.Current.BoundingRectangle
            $bitmap = New-Object System.Drawing.Bitmap ([int]$bounds.Width), ([int]$bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen([System.Drawing.Point]::new([int]$bounds.X, [int]$bounds.Y), [System.Drawing.Point]::Empty, $bitmap.Size)
            $bitmap.Save("C:\shots\$name.png"); $graphics.Dispose(); $bitmap.Dispose()
          }
          try {
            Write-Output "installed: $(Version)"
            $old = Start-Process C:\app\ReAI.Shipping.exe -PassThru
            $window = Window $old
            $button = Find $window 'Restart to update'
            Shot $window '1-update-ready'
            $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            do { Start-Sleep -Seconds 1; $new = Running | Where-Object Id -ne $old.Id } while (-not $new -and [DateTime]::UtcNow -lt $deadline)
            if (-not $new) { throw "The app did not restart. Installed: $(Version)" }
            Write-Output "restarted as pid $($new.Id) (was $($old.Id)); installed: $(Version); old exited: $($old.HasExited)"
            if ((Version) -ne '0.1.2.0') { throw 'Not updated to 0.1.2' }
            $window = Window $new
            $check = Find $window 'Check for updates'
            Shot $window '2-restarted'
            if ((Get-Content C:\app\keep.txt) -ne 'not part of the app') { throw 'Foreign file changed' }
            $check.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Seconds 8
            Shot $window '3-checked'
            Write-Output "staging after restart: $((Get-ChildItem $staging).Name -join ', ')"
            Stop-Process -Id $new.Id; Start-Sleep -Seconds 2

            Copy-Item C:\later\0.1.3 "$staging\0.1.3" -Recurse
            $app = Start-Process C:\app\ReAI.Shipping.exe -PassThru
            $window = Window $app
            Find $window 'Restart to update' | Out-Null
            $app.CloseMainWindow() | Out-Null
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            do { Start-Sleep -Seconds 1 } while (((Version) -ne '0.1.3.0' -or (Get-Process ReAI.Shipping -ErrorAction SilentlyContinue)) -and [DateTime]::UtcNow -lt $deadline)
            Write-Output "after close: installed $(Version); still running: $(@(Get-Process ReAI.Shipping -ErrorAction SilentlyContinue).Count)"
            if ((Version) -ne '0.1.3.0' -or (Get-Process ReAI.Shipping -ErrorAction SilentlyContinue)) { throw 'Close did not install 0.1.3 quietly' }
            $app = Start-Process C:\app\ReAI.Shipping.exe -PassThru
            $window = Window $app
            Find $window 'Check for updates' | Out-Null
            Shot $window '4-after-close-install'
            Write-Output "staging at the end: $((Get-ChildItem $staging).Name -join ', ')"
          } finally {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -like '*ReAI.Shipping*' } | Select-Object -First 3 -ExpandProperty Message
            Get-Process ReAI.Shipping -ErrorAction SilentlyContinue | Stop-Process
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: updatecheck
          path: C:\shots
          retention-days: 3
