name: Release app
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        required: true
        type: choice
        options: [time-tracker, finder-vault, import, stripe, vipps, klarna, zettle, dintero]
  pull_request:
    paths: ['apple/**', 'tools/apple/**', 'apps.json', '.github/actions/**', '.github/workflows/apps.yml']
  push:
    branches: [main]
    tags: ['*/v*']
    paths: ['apple/**', 'tools/apple/**', 'apps.json', '.github/actions/**', '.github/workflows/apps.yml']
permissions:
  contents: read
concurrency:
  group: apple-${{ github.event_name == 'workflow_dispatch' && inputs.app || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
      has_apps: ${{ steps.apps.outputs.has_apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: apps
        run: python3 tools/apple/matrix.py
  build:
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/swift
      - name: Build Apple Silicon app
        env:
          APP_ID: ${{ matrix.id }}
          APP_VERSION: ${{ matrix.version }}
        run: python3 tools/apple/build.py "$APP_ID" --version "$APP_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.id }}-unsigned
          path: dist/${{ matrix.id }}/unsigned.zip
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: apple-release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.id }}-unsigned
          path: dist/${{ matrix.id }}
      - name: Sign and notarize
        env:
          APP_ID: ${{ matrix.id }}
          APP_VERSION: ${{ matrix.version }}
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_PASSWORD: ${{ secrets.APPLE_SIGNING_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 tools/apple/release.py "$APP_ID" --version "$APP_VERSION"
      - name: Preserve notarization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.id }}-notarization
          path: dist/${{ matrix.id }}/notarization*
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish verified download
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ matrix.id }}
          APP_NAME: ${{ matrix.name }}
          APP_VERSION: ${{ matrix.version }}
          APP_ASSET: ${{ matrix.asset }}
        run: |
          python3 tools/apple/release-notes.py "$APP_ID" > "$RUNNER_TEMP/release-notes.md"
          RELEASE_TAG="$APP_ID/v$APP_VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" "dist/$APP_ID/$APP_ASSET" "dist/$APP_ID/SHA256SUMS" --verify-tag --latest=false --title "$APP_NAME $APP_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh workflow run pages.yml --ref main
