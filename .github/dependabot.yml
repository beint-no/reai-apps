version: 2
updates:
- package-ecosystem: nuget
  directories:
  - /windows/import
  - /windows/shipping
  - /windows/time-tracker
  schedule:
    interval: monthly
    time: '04:00'
    timezone: Europe/Oslo
  groups:
    windows-dependencies:
      patterns:
      - '*'
  open-pull-requests-limit: 5
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
    time: '04:00'
    timezone: Europe/Oslo
  groups:
    github-actions:
      patterns:
      - '*'
  open-pull-requests-limit: 5
- package-ecosystem: dotnet-sdk
  directory: /windows
  schedule:
    interval: monthly
    time: '04:00'
    timezone: Europe/Oslo
  open-pull-requests-limit: 5
- package-ecosystem: swift
  directories:
  - /apple/import
  - /apple/product-labels
  - /apple/shipping
  schedule:
    interval: monthly
    time: '04:00'
    timezone: Europe/Oslo
  groups:
    apple-libraries:
      patterns:
      - '*'
  open-pull-requests-limit: 5
