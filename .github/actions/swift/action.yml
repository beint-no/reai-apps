name: Swift
description: Install the Swift toolchain used by the Apple apps.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl --fail --location --proto '=https' --tlsv1.2 https://download.swift.org/swiftly/darwin/swiftly.pkg -o "$RUNNER_TEMP/swiftly.pkg"
        pkgutil --check-signature "$RUNNER_TEMP/swiftly.pkg"
        installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
        "$HOME/.swiftly/bin/swiftly" init --skip-install --assume-yes --no-modify-profile
        source "$HOME/.swiftly/env.sh"
        swift_version=$(cat .swift-version)
        swiftly install "$swift_version" --assume-yes
        echo "SWIFT_BIN=$(swiftly run which swift +"$swift_version")" >> "$GITHUB_ENV"
