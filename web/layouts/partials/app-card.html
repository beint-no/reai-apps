{{ $p := .page }}
{{ $h2 := eq .level "h2" }}
<article class="app-card"{{ with $p.Params.industry }} data-industry="{{ . }}"{{ end }} data-search="{{ $p.Title }} {{ $p.Summary }}">
  {{ if $h2 }}<h2><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h2>{{ else }}<h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>{{ end }}
  <p>{{ $p.Summary }}</p>
  <div class="card-actions">
    {{ with $p.Params.webAppUrl }}<a class="text-link" href="{{ . }}">{{ T "open_web_app" }} →</a>{{ else }}<a class="text-link" href="{{ $p.RelPermalink }}">{{ T "learn_more" }} →</a>{{ end }}
  </div>
</article>
