<div class="catalog-filter" data-catalog-filter>
  <input type="search" class="filter-search" placeholder="{{ T "filter_placeholder" }}" aria-label="{{ T "filter_placeholder" }}">
  <div class="filter-pills" role="group" aria-label="{{ T "home_industries_heading" }}">
    <button type="button" class="filter-pill" data-industry="all" aria-pressed="true">{{ T "filter_all" }}</button>
    <button type="button" class="filter-pill" data-industry="payments" aria-pressed="false">{{ T "filter_payments" }}</button>
    <button type="button" class="filter-pill" data-industry="ecommerce-logistics" aria-pressed="false">{{ T "filter_ecommerce" }}</button>
    <button type="button" class="filter-pill" data-industry="operations" aria-pressed="false">{{ T "filter_operations" }}</button>
    <button type="button" class="filter-pill" data-industry="real-estate" aria-pressed="false">{{ T "filter_realestate" }}</button>
  </div>
  <span class="filter-count" data-filter-count aria-live="polite"></span>
</div>
