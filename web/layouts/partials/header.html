<header class="site-header wrap">
  <a class="brand" href="{{ site.Home.RelPermalink }}"><span class="brand-mark">r</span>ReAI <span class="brand-suffix">Apps</span></a>
  <nav class="main-nav">
    {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    {{ range .Translations }}<a class="lang-switch" href="{{ .RelPermalink }}" lang="{{ .Language.Code }}">{{ .Language.Label }}</a>{{ end }}
    <a class="button primary nav-cta" href="{{ site.Params.signupUrl }}">{{ T "try_reai_free" }} →</a>
  </nav>
</header>
